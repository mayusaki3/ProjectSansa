# =====================================================================
# Spring profile: "it"
# 目的:
#   - Integration Test 実行時に servlet + ランダムポート + in-memory mail を保証
#   - inmem 設定の取り込みは ITBase の @ActiveProfiles({"it","inmem"}) で行う
# =====================================================================

spring:
  main:
    # IT は実サーバ（組み込み）を起動して HTTP で検証する想定
    web-application-type: servlet

server:
  # Failsafe の並列実行やポート衝突を避ける
  port: 0

# ---------------------------------------------------------------------
# アプリ固有設定（inmem をベースに、ITで保証したいものだけ明示）
# ---------------------------------------------------------------------
app:
  mail:
    enabled: true
    transport: inmem
    from: "no-reply@sansa.space"

# NOTE:
# - JWT の TTL は ITBase.java の @TestPropertySource で正の値を強制上書き。
# - application-it.yml では「spring.profiles.include」は使わない（Boot 3.x で無効扱い）。
